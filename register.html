<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đăng ký TOEIC</title><link rel="stylesheet" href="css/style.css"></head>
<body><main class="wrap"><div class="brand">TOEIC VOCABULARY</div><section class="card">
<h1>Tạo tài khoản</h1><p>Tài khoản mới mặc định là học viên.</p>
<form onsubmit="registerUser(event)">
<label>Họ và tên</label><input id="fullName" required placeholder="Tên của bạn">
<label>Email</label><input id="email" type="email" required placeholder="email@example.com">
<label>Mật khẩu</label><input id="password" type="password" minlength="8" required placeholder="Ít nhất 8 ký tự">
<button type="submit">Đăng ký</button></form><div id="message" class="message"></div>
<p class="note">Đã có tài khoản? <a href="login.html">Đăng nhập</a></p></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/auth.js"></script></body></html>
