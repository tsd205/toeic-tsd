
<!doctype html>
<html lang="vi">

<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>Đăng ký | TOEIC TSD</title>

  <!-- CSS hiện tại -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/theme.css">

  <!-- Midnight Study Music -->
  <link rel="stylesheet" href="css/lofi.css?v=3">

  <!-- Hiệu ứng tuyết rơi -->
  <link rel="stylesheet" href="css/snow.css?v=1">

  <!-- Chế độ sáng / tối -->
  <script src="js/theme.js"></script>
</head>

<body>

  <!-- Nút đổi giao diện -->
  <button
    class="theme-toggle theme-fixed"
    type="button"
    onclick="toggleTheme()"
  >
    🌙 Chế độ tối
  </button>

  <main class="wrap">

    <div class="brand">
      TOEIC VOCABULARY TSD
    </div>

    <section class="card">

      <h1>Tạo tài khoản</h1>

      <p>
        Tài khoản mới mặc định là học viên.
      </p>

      <!-- Form đăng ký -->
      <form onsubmit="registerUser(event)">

        <label for="fullName">
          Họ và tên
        </label>

        <input
          id="fullName"
          required
          placeholder="Tên của bạn"
        >

        <label for="email">
          Email
        </label>

        <input
          id="email"
          type="email"
          required
          placeholder="email@example.com"
        >

        <label for="password">
          Mật khẩu
        </label>

        <div class="password-field">

          <input
            id="password"
            type="password"
            minlength="8"
            required
            placeholder="Ít nhất 8 ký tự"
          >

          <button
            class="eye-toggle"
            type="button"
            onclick="togglePassword('password', this)"
            aria-label="Hiện mật khẩu"
          >
            👁
          </button>

        </div>

        <label for="confirmPassword">
          Xác nhận mật khẩu
        </label>

        <div class="password-field">

          <input
            id="confirmPassword"
            type="password"
            minlength="8"
            required
            placeholder="Nhập lại mật khẩu"
          >

          <button
            class="eye-toggle"
            type="button"
            onclick="togglePassword('confirmPassword', this)"
            aria-label="Hiện mật khẩu"
          >
            👁
          </button>

        </div>

        <button type="submit">
          Đăng ký
        </button>

      </form>

      <!-- Thông báo đăng ký -->
      <div
        id="message"
        class="message"
      ></div>

      <p class="note">
        Đã có tài khoản?
        <a href="login.html">Đăng nhập</a>
      </p>

    </section>

  </main>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Cấu hình và xác thực -->
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>

  <!-- Midnight Study Music -->
  <script src="js/lofi.js?v=3" defer></script>

  <!-- Hiệu ứng tuyết rơi -->
  <script src="js/snow.js?v=1" defer></script>

</body>
</html>
