
<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>TOEIC TSD - Chọn Test</title>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/learning.css">
  <link rel="stylesheet" href="css/theme.css">

  <style>
    .test-dropdown {
      margin: 18px 0;
      border: 1px solid #7183a655;
      border-radius: 12px;
      overflow: hidden;
    }

    .test-dropdown summary {
      cursor: pointer;
      padding: 16px;
      font-size: 16px;
      font-weight: 700;
      list-style: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .test-dropdown summary::-webkit-details-marker {
      display: none;
    }

    .test-dropdown summary::after {
      content: "▼";
      font-size: 13px;
      transition: transform .2s;
    }

    .test-dropdown[open] summary::after {
      transform: rotate(180deg);
    }

    .test-dropdown-content {
      padding: 12px 16px 16px;
      border-top: 1px solid #7183a655;
    }

    .selected-count {
      font-size: 13px;
      font-weight: normal;
      opacity: .8;
      margin-left: auto;
    }

    .test-dropdown .choice {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      margin: 8px 0;
      border: 1px solid #7183a655;
      border-radius: 9px;
      cursor: pointer;
    }

    .test-dropdown .choice input {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      margin: 0;
    }

    .test-dropdown .choice span {
      flex: 1;
    }

    .test-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    .test-actions button {
      flex: 1;
      min-width: 120px;
    }

    .start-button {
      width: 100%;
      margin-top: 18px;
      padding: 14px;
      font-size: 16px;
      font-weight: 700;
    }
  </style>

  <script src="js/theme.js"></script>
</head>

<body>
  <main class="learning">
    <header>
      <strong>TOEIC VOCABULARY TSD</strong>

      <nav class="nav-actions">
        <a href="profile.html">👤 Cá nhân</a>

        <button
          class="theme-toggle"
          type="button"
          onclick="toggleTheme()">
          🌙 Chế độ tối
        </button>

        <button type="button" onclick="logoutUser()">
          Đăng xuất
        </button>
      </nav>
    </header>

    <section class="panel">
      <h1 id="welcome">Đang tải...</h1>

      <p id="role"></p>

      <p>Chọn một hoặc nhiều Test để luyện tập.</p>

      <!-- DANH SÁCH TEST THU GỌN -->
      <details class="test-dropdown" id="testDropdown">
        <summary>
          <span>📚 Danh sách Test</span>
          <span class="selected-count" id="selectedCount">
            0 đã chọn
          </span>
        </summary>

        <div class="test-dropdown-content">
          <div id="testChoices">
            Đang tải danh sách...
          </div>

          <div class="test-actions">
            <button type="button" id="selectAll">
              Chọn tất cả
            </button>

            <button type="button" id="clearAll">
              Bỏ chọn
            </button>
          </div>
        </div>
      </details>

      <!-- CHẾ ĐỘ HỌC -->
      <fieldset>
        <legend>Chế độ học</legend>

        <label>
          <input
            type="radio"
            name="mode"
            value="sequential"
            checked>
          Lần lượt từng Test
        </label>

        <label>
          <input
            type="radio"
            name="mode"
            value="random">
          Trộn ngẫu nhiên các Test
        </label>
      </fieldset>

      <p id="notice" role="status"></p>

      <button id="start" class="start-button" type="button">
        🚀 Bắt đầu luyện tập
      </button>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>

  <script>
    (async () => {
      const user = await requireLogin();
      if (!user) return;

      const $ = id => document.getElementById(id);

      // ===== THÔNG TIN NGƯỜI DÙNG =====

      const { data: profile } = await supabaseClient
        .from("profiles")
        .select("full_name,role")
        .eq("id", user.id)
        .single();

      $("welcome").textContent =
        "Xin chào, " +
        (profile?.full_name || user.email);

      $("role").textContent =
        "Vai trò: " +
        (profile?.role || "student");

      if (profile?.role === "admin") {
        const a = document.createElement("a");
        a.href = "admin.html";
        a.textContent = "Mở trang quản trị";

        $("role").append(" · ", a);
      }

      // ===== TẢI DANH SÁCH TEST =====

      const { data, error } = await supabaseClient
        .from("tests")
        .select("id,title,description")
        .eq("is_active", true)
        .order("id");

      const box = $("testChoices");
      box.replaceChildren();

      if (error) {
        box.textContent = error.message;
        return;
      }

      if (!data || !data.length) {
        box.textContent =
          "Chưa có Test nào đang hoạt động.";
        return;
      }

      // ===== CẬP NHẬT SỐ TEST ĐÃ CHỌN =====

      function updateSelectedCount() {
        const selected = box.querySelectorAll(
          'input[name="test"]:checked'
        ).length;

        $("selectedCount").textContent =
          selected + " đã chọn";
      }

      // ===== HIỂN THỊ TEST =====

      for (const test of data) {
        const label = document.createElement("label");
        label.className = "choice";

        const check = document.createElement("input");
        check.type = "checkbox";
        check.value = String(test.id);
        check.name = "test";

        check.addEventListener(
          "change",
          updateSelectedCount
        );

        const span = document.createElement("span");

        span.textContent =
          test.title +
          (test.description
            ? " — " + test.description
            : "");

        label.append(check, span);
        box.append(label);
      }

      updateSelectedCount();

      // ===== CHỌN TẤT CẢ =====

      $("selectAll").onclick = () => {
        box.querySelectorAll(
          'input[name="test"]'
        ).forEach(input => {
          input.checked = true;
        });

        updateSelectedCount();
      };

      // ===== BỎ CHỌN =====

      $("clearAll").onclick = () => {
        box.querySelectorAll(
          'input[name="test"]'
        ).forEach(input => {
          input.checked = false;
        });

        updateSelectedCount();
      };

      // ===== BẮT ĐẦU LUYỆN TẬP =====

      $("start").onclick = () => {
        const ids = [
          ...box.querySelectorAll(
            'input[name="test"]:checked'
          )
        ].map(input => Number(input.value));

        if (!ids.length) {
          $("notice").textContent =
            "Bạn cần chọn ít nhất 1 Test.";

          // Tự mở danh sách để chọn
          $("testDropdown").open = true;
          return;
        }

        $("notice").textContent = "";

        const mode = document.querySelector(
          'input[name="mode"]:checked'
        ).value;

        // Giữ đúng cấu trúc cũ cho practice.html
        sessionStorage.setItem(
          "toeic_selection",
          JSON.stringify({ ids, mode })
        );

        location.href = "practice.html";
      };
    })();
  </script>
</body>
</html>
