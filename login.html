
<!doctype html>
<html lang="vi">

<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Đăng nhập | TOEIC TSD</title>

  <!-- CSS hiện tại -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/theme.css?v=6">

  <!-- Midnight Study -->
  <link rel="stylesheet" href="css/lofi.css?v=3">

  <!-- Hiệu ứng tuyết rơi -->
  <link rel="stylesheet" href="css/snow.css?v=1">

  <!-- Chuyển chế độ sáng/tối -->
  <script src="js/theme.js"></script>
</head>

<body>

  <!-- Nút chuyển giao diện -->
  <button
    class="theme-toggle theme-fixed"
    type="button"
    onclick="toggleTheme()"
  >
    🌙 Chế độ tối
  </button>

  <main class="wrap">

    <div class="brand">
      TOEIC VOCABULARY TSD
    </div>

    <section class="card">

      <h1>Chào mừng trở lại</h1>

      <p>
        Đăng nhập để tiếp tục ôn từ vựng
        theo từng Test.
      </p>

      <!-- Form đăng nhập -->
      <form onsubmit="loginUser(event)">

        <label for="email">
          Email
        </label>

        <input
          id="email"
          type="email"
          required
          placeholder="email@example.com"
        >

        <label for="password">
          Mật khẩu
        </label>

        <div class="password-field">

          <input
            id="password"
            type="password"
            required
            placeholder="Nhập mật khẩu"
          >

          <button
            class="eye-toggle"
            type="button"
            onclick="togglePassword('password', this)"
            aria-label="Hiện mật khẩu"
          >
            👁
          </button>

        </div>

        <button type="submit">
          Đăng nhập
        </button>

      </form>

      <!-- Thông báo đăng nhập -->
      <div
        id="message"
        class="message"
      ></div>

      <p class="note">
        Chưa có tài khoản?
        <a href="register.html">
          Đăng ký tại đây
        </a>
      </p>

    </section>

  </main>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Cấu hình và đăng nhập -->
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>

  <!-- Midnight Study Music Player -->
  <script src="js/lofi.js?v=3" defer></script>

  <!-- Hiệu ứng tuyết rơi -->
  <script src="js/snow.js?v=1" defer></script>

</body>
</html>
