<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đăng nhập TOEIC</title><link rel="stylesheet" href="css/style.css"></head>
<body><main class="wrap"><div class="brand">TOEIC VOCABULARY TSD</div><section class="card">
<h1>Chào mừng trở lại</h1><p>Đăng nhập để tiếp tục ôn từ vựng theo từng Test.</p>
<form onsubmit="loginUser(event)">
<label>Email</label><input id="email" type="email" required placeholder="email@example.com">
<label>Mật khẩu</label><input id="password" type="password" required placeholder="Nhập mật khẩu">
<button type="submit">Đăng nhập</button></form><div id="message" class="message"></div>
<p class="note">Chưa có tài khoản? <a href="register.html">Đăng ký tại đây</a></p></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/auth.js"></script></body></html>
